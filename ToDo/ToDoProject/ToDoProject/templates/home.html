<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TODO LIST - Home</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">

    <style>
        body {
            background-color: #f4f6f9;
        }

        .app-title {
            font-weight: 600;
        }

        .task-container {
            max-height: 450px;
            overflow-y: auto;
        }

        .card {
            border-radius: 12px;
            border: none;
            transition: all 0.2s ease;
        }

        .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.08);
        }

        .btn-icon {
            padding: 6px 10px;
        }

        .completed {
            background-color: #e9ecef;
            text-decoration: line-through;
            color: #6c757d;
        }

        .form-control {
            padding: 1.1rem .75rem;
            border-radius: 10px;
        }

        .add-btn {
            border-radius: 10px;
            width: 140px;
        }
    </style>
</head>

<body>
    <div class="container py-4">
        <h3 class="text-center app-title mb-1">Django ToDo App</h3>
        <p class="text-center text-muted mb-4">{% now "jS F Y" %}</p>

        <div class="row g-4">
            <div class="col-md-7">
                <h5 class="mb-3">My Day</h5>
                <div class="task-container">
                    {% for task in tasks %}
                    <div class="card mb-2">
                        <div class="card-body d-flex justify-content-between align-items-center">
                            <span class="task-text" id="task-text-{{ task.pk }}">{{ task.task }}</span>

                            <input type="text" class="form-control d-none" id="task-input-{{ task.pk }}"
                                value="{{ task.task }}" onkeydown="handleKey(event, {{ task.pk }})"
                                onblur="cancelEdit({{ task.pk }})">

                            <span class="task-actions" id="actions-{{ task.pk }}">
                                <a href="{% url 'ToDoApplication:markAsDone' task.pk %}"
                                    class="btn btn-success btn-icon"><i class="fas fa-check"></i></a>
                                <a href="{% url 'ToDoApplication:deleteTask' task.pk %}"
                                    class="btn btn-danger btn-icon"><i class="fas fa-trash"></i></a>
                                <button class="btn btn-primary btn-icon" onclick="enableEdit({{ task.pk }})"><i
                                        class="fas fa-edit"></i></button>
                            </span>
                        </div>
                    </div>
                    {% empty %}
                    <p class="text-muted">No tasks for today 🎉</p>
                    {% endfor %}
                </div>
            </div>

            <div class="col-md-5">
                <h5 class="mb-3">Completed Tasks</h5>
                <div class="task-container">
                    {% for task in completed_tasks %}
                    <div class="card mb-2 completed">
                        <div class="card-body d-flex justify-content-between align-items-center">
                            <span>{{ task.task }}</span>
                            <a href="{% url 'ToDoApplication:markAsUndone' task.pk %}"
                                class="btn btn-secondary btn-icon"><i class="fas fa-times"></i></a>
                        </div>
                    </div>
                    {% empty %}
                    <p class="text-muted">No completed tasks yet</p>
                    {% endfor %}
                </div>
            </div>
        </div>

        <div class="row mt-4">
            <div class="col-md-7">
                <form action="{% url 'ToDoApplication:addTask' %}" method="POST">
                    {% csrf_token %}
                    <div class="d-flex gap-2">
                        <input type="text" name="addTask" class="form-control" placeholder="Add a new task..." required>
                        <button type="submit" class="btn btn-primary add-btn">Add</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        function enableEdit(taskId) {
            const text = document.getElementById(`task-text-${taskId}`);
            const input = document.getElementById(`task-input-${taskId}`);
            const actions = document.getElementById(`actions-${taskId}`);

            text.classList.add('d-none');
            actions.classList.add('d-none');
            input.classList.remove('d-none');
            input.focus();
            // Move cursor to end of text
            input.setSelectionRange(input.value.length, input.value.length);
        }

        function handleKey(event, taskId) {
            if (event.key === 'Enter') {
                event.preventDefault();
                saveTask(taskId);
            } else if (event.key === 'Escape') {
                cancelEdit(taskId);
            }
        }

        function saveTask(taskId) {
            const input = document.getElementById(`task-input-${taskId}`);
            const text = document.getElementById(`task-text-${taskId}`);
            const actions = document.getElementById(`actions-${taskId}`);

            if (!input.value.trim()) {
                cancelEdit(taskId);
                return;
            }

            const csrftoken = document.querySelector('[name=csrfmiddlewaretoken]').value;
            const formData = new FormData();
            formData.append("task", input.value);

            // --- UPDATED LINE BELOW ---
            // This generates the correct URL dynamically (e.g., /todo/edit-task/5/)
            const url = "{% url 'ToDoApplication:editTask' 0 %}".replace('0', taskId);

            fetch(url, {
                method: 'POST',
                headers: {
                    'X-CSRFToken': csrftoken
                },
                body: formData
            })
                .then(res => {
                    if (!res.ok) throw new Error("Server error");
                    return res.json();
                })
                .then(data => {
                    text.textContent = data.task;
                    finalizeUI(taskId);
                })
                .catch(err => {
                    console.error("Fetch error:", err);
                    alert("Could not save changes.");
                    cancelEdit(taskId);
                });
        }

        function cancelEdit(taskId) {
            finalizeUI(taskId);
        }

        function finalizeUI(taskId) {
            const input = document.getElementById(`task-input-${taskId}`);
            const text = document.getElementById(`task-text-${taskId}`);
            const actions = document.getElementById(`actions-${taskId}`);
            input.classList.add('d-none');
            text.classList.remove('d-none');
            actions.classList.remove('d-none');
        }
    </script>
</body>

</html>
