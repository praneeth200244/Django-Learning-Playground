<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TODO LIST - Home</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Font Awesome 5 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">

    <style>
        body {
            background-color: #f4f6f9;
        }

        .app-title {
            font-weight: 600;
        }

        .date-text {
            font-size: 0.9rem;
        }

        .task-container {
            max-height: 450px;
            overflow-y: auto;
        }

        .card {
            border-radius: 12px;
            border: none;
            transition: all 0.2s ease;
        }

        .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.08);
        }

        .task-text {
            font-size: 0.95rem;
        }

        .task-actions a {
            margin-left: 6px;
        }

        .btn-icon {
            padding: 6px 10px;
        }

        .completed {
            background-color: #e9ecef;
            text-decoration: line-through;
            color: #6c757d;
        }

        .add-task-box {
            position: sticky;
            bottom: 20px;
        }

        .form-control {
            padding: 1.1rem .75rem;
            border-radius: 10px;
        }

        .add-btn {
            border-radius: 10px;
            width: 140px;
        }
    </style>
</head>

<body>
    <div class="container py-4">
        <h3 class="text-center app-title mb-1">Django ToDo App</h3>
        <p class="text-center text-muted date-text mb-4">{% now "jS F Y" %}</p>

        <div class="row g-4">
            <!-- Active Tasks -->
            <div class="col-md-7">
                <h5 class="mb-3">My Day</h5>
                <div class="task-container">
                    {% for task in tasks %}
                    <div class="card mb-2">
                        <div class="card-body d-flex justify-content-between align-items-center">
                            <span class="task-text">{{ task.task }}</span>
                            <span class="task-actions">
                                <a href="{% url 'ToDoApplication:markAsDone' task.pk %}"
                                    class="btn btn-success btn-icon" title="Mark as Done">
                                    <i class="fas fa-check"></i>
                                </a>
                                <a href="{% url 'ToDoApplication:deleteTask' task.pk %}" class="btn btn-danger btn-icon"
                                    title="Delete">
                                    <i class="fas fa-trash"></i>
                                </a>
                                <a class="btn btn-primary btn-icon" title="Edit">
                                    <i class="fas fa-edit"></i>
                                </a>
                            </span>
                        </div>
                    </div>
                    {% empty %}
                    <p class="text-muted">No tasks for today 🎉</p>
                    {% endfor %}
                </div>
            </div>

            <!-- Completed Tasks -->
            <div class="col-md-5">
                <h5 class="mb-3">Completed Tasks</h5>
                <div class="task-container">
                    {% for task in completed_tasks %}
                    <div class="card mb-2 completed">
                        <div class="card-body d-flex justify-content-between align-items-center">
                            <span class="task-text">{{ task.task }}</span>
                            <a href="{% url 'ToDoApplication:markAsUndone' task.pk %}"
                                class="btn btn-secondary btn-icon" title="Mark as Undone">
                                <i class="fas fa-times"></i>
                            </a>
                        </div>
                    </div>
                    {% empty %}
                    <p class="text-muted">No completed tasks yet</p>
                    {% endfor %}
                </div>
            </div>
        </div>

        <!-- Add Task -->
        <div class="row mt-4">
            <div class="col-md-7 add-task-box">
                <form action="{% url 'ToDoApplication:addTask' %}" method="POST">
                    {% csrf_token %}
                    <div class="d-flex gap-2">
                        <input type="text" name="addTask" class="form-control" placeholder="Add a new task..." required>
                        <button type="submit" class="btn btn-primary add-btn">
                            <i class="fas fa-plus me-1"></i> Add
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>

</html>
